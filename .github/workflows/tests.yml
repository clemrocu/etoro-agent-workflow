name: socle checks

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions: {}

jobs:
  pure-checks:
    runs-on: ubuntu-latest
    concurrency:
      group: socle-checks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile every module
        run: python3 -m compileall -q apps packages
      - name: Pure guardrail checks (real pydantic, minimal env)
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install --disable-pip-version-check --quiet pydantic
          ./.venv/bin/python apps/worker/tests/test_rules.py
          ./.venv/bin/python apps/worker/tests/test_pullback.py
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Frozen-lock sync diagnosis (non-blocking, never fails the job)
        run: |
          set +e
          out=$(bash tools/uv.sh sync --all-packages --frozen --no-dev 2>&1)
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::uv sync --frozen exits $code (pre-existing failure kept for diagnosis; the deployment build remains the gate) - tail:"
            echo "$out" | tail -20
          fi

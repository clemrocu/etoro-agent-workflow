name: generate uv.lock

on:
  push:
    branches: ["**"]
    paths:
      - "pyproject.toml"
      - "**/pyproject.toml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    concurrency:
      group: generate-uv-lock
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv lock
      - name: Commit lock if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet || git commit -m "chore: generate uv.lock"
          git push
